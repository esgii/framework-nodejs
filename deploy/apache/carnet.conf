<VirtualHost *:80>
    ServerName carnet.example.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/carnet-error.log
    CustomLog ${APACHE_LOG_DIR}/carnet-access.log combined
</VirtualHost>
